<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Item Shuffler</title>
<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;--font:"Comic Sans MS","Comic Sans","Comic Neue","Chalkboard SE",cursive,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f4f8;--fg:#1b1c2a;--panel:#fff;--bd:#d6d8e4;--mut:#6b6e85}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14151f;--fg:#f1f2fa;--panel:#232536;--bd:#3a3d57;--mut:#9a9db8}}
:root[data-theme="dark"]{--bg:#14151f;--fg:#f1f2fa;--panel:#232536;--bd:#3a3d57;--mut:#9a9db8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font-family:var(--font);margin:0;min-height:100%}
.app{display:flex;flex-wrap:wrap;gap:32px;justify-content:center;align-items:flex-start;padding:24px 16px;max-width:1100px;margin:0 auto}
.left{display:flex;flex-direction:column;align-items:center;gap:20px;flex:2 1 300px}
.right{flex:1 1 340px;max-width:100%;display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:14px}
h2{font-size:14px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.stage{position:relative;width:230px;height:210px;display:flex;align-items:center;justify-content:center}
.bob{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-14px)}}
.scene{perspective:600px;width:120px;height:120px}
.cube{position:relative;width:120px;height:120px;transform-style:preserve-3d;animation:spin 5s linear infinite}
@keyframes spin{from{transform:rotateX(-20deg) rotateY(0)}to{transform:rotateX(-20deg) rotateY(360deg)}}
.face{position:absolute;inset:0;box-sizing:border-box;border:4px solid rgba(200,255,255,.75);border-radius:24px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(135deg,#19d3ff,#2f8bff,#27f0d6,#6fe86a,#9a8bff,#19d3ff);background-size:300% 300%;animation:flow 3s linear infinite;opacity:.88;box-shadow:0 0 22px rgba(60,240,255,.7),inset 0 0 28px rgba(255,255,255,.6)}
.face::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 12% 88%,rgba(60,255,200,.55) 0 30%,transparent 31%),radial-gradient(circle at 92% 12%,rgba(30,100,255,.5) 0 32%,transparent 33%),linear-gradient(135deg,transparent 62%,rgba(200,170,255,.4) 62%)}
.face::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 18%,rgba(255,255,255,.95) 19%,rgba(255,255,255,.95) 20.5%,transparent 22%),linear-gradient(135deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,0) 35%)}
.q{position:relative;z-index:1;width:68%;height:68%;filter:drop-shadow(0 2px 4px rgba(0,40,80,.35))}
@keyframes flow{to{background-position:300% 300%}}
.face:nth-child(1){transform:translateZ(60px)}.face:nth-child(2){transform:rotateY(90deg) translateZ(60px)}.face:nth-child(3){transform:rotateY(180deg) translateZ(60px)}.face:nth-child(4){transform:rotateY(-90deg) translateZ(60px)}.face:nth-child(5){transform:rotateX(90deg) translateZ(60px)}.face:nth-child(6){transform:rotateX(-90deg) translateZ(60px)}
.bob.hit{animation:smash .35s ease-out forwards}
@keyframes smash{40%{transform:scale(1.3)}100%{transform:scale(1.8);opacity:0}}
.shard{position:absolute;left:50%;top:50%;width:14px;height:14px;border-radius:3px;pointer-events:none;transition:transform .7s cubic-bezier(.1,.8,.3,1),opacity .7s}
.reel{position:absolute;width:200px;height:140px;border-radius:18px;background:var(--panel);border:4px solid var(--bd);display:none;align-items:center;justify-content:center;overflow:hidden;padding:8px;box-sizing:border-box;text-align:center}
.reel.on{display:flex}.reel.spin{filter:blur(.5px)}.reel.done{border-color:transparent;background:linear-gradient(var(--panel),var(--panel)) padding-box,linear-gradient(135deg,#ff3b5c,#ffb703,#7bd83a,#25c7f0,#8a5cff,#ff3b5c) border-box;background-size:100% 100%,300% 300%;animation:pop .5s ease-out,flow 3s linear infinite}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.reel img{max-width:100%;max-height:100%;object-fit:contain}
.reel .t{font-size:30px;font-weight:800;word-break:break-word;line-height:1.1}
.reel .c{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;max-width:100%;max-height:100%}
.reel .c.both img{max-height:82px}
.reel .c.both .t{font-size:20px}
li .p img{margin-right:8px}
#boxes{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.col{display:flex;flex-direction:column;align-items:center;gap:6px}
.label{width:230px;height:46px;box-sizing:border-box;font:900 32px var(--font);text-align:center;color:var(--fg);-webkit-text-stroke:0.8px currentColor;background:transparent;border:1px dashed transparent;border-radius:8px;padding:0 8px;outline:none}
.label::placeholder{-webkit-text-stroke:0;color:var(--mut);font-weight:600;font-size:22px;opacity:.7}
.label:hover,.label:focus{border-color:var(--bd)}
button.on{background:#ff3b5c;color:#fff;border-color:#ff3b5c}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
button,.btn{font:600 14px var(--font);padding:8px 14px;border-radius:999px;border:1px solid var(--bd);background:var(--panel);color:var(--fg);cursor:pointer}
button.main{font-size:16px;padding:12px 28px;border:0;background:#ff3b5c;color:#fff}
button:disabled{opacity:.45;cursor:default}
input[type=text],input[type=url]{font:15px var(--font);padding:8px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);min-width:0;flex:1}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.lbl{font-size:13px;color:var(--mut);width:48px}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
li{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--bd);border-radius:10px}
li .n{color:var(--mut);font-size:12px;width:18px}
li .p{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li img{height:34px;max-width:70px;object-fit:contain;vertical-align:middle;border-radius:4px}
li button{padding:3px 9px}
#msg{font-size:13px;color:#e63946;min-height:16px}
.hint{font-size:12px;color:var(--mut)}
label.opt{display:flex;gap:8px;align-items:center;margin:4px 0;font-size:15px}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="bz" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b8286"/><stop offset=".55" stop-color="#a39a5c"/><stop offset="1" stop-color="#a24852"/></linearGradient>
<linearGradient id="wh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3d8ff"/><stop offset=".4" stop-color="#fff"/></linearGradient>
<g id="qm"><polygon points="25.8,0 86.5,9.2 100,54 68.7,63.2 70,100 27,96.3 33,58.9 0,38.7" fill="url(#bz)" stroke="#d9bfff" stroke-width="1.2"/><g fill="url(#wh)"><polygon points="30,10 80.4,17.9 89.6,49 64,56.5 64,38 40,31.5 31,47 13,37.5"/><polygon points="41,48 61.5,43 61.5,65.6 41.7,64.4"/><polygon points="41,71.8 60.7,73 61.3,90.8 38,88.3"/></g></g>
</defs></svg>
<div class="app">
 <div class="left">
  <div id="boxes"></div>
  <button class="main" id="btn">Hit the box</button>
 </div>
 <div class="right">
  <div class="card"><h2>Number of boxes</h2><div class="row" id="counts" style="margin:0"></div></div>
  <div class="card">
   <h2>Items in <span id="curn">Box 1</span> (<span id="count">0</span>)</h2>
   <div class="row" id="tabs"></div>
   <div style="padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--bd)">
   <div class="row"><span class="lbl">Text</span><input type="text" id="txt" placeholder="Type something (optional)"></div>
   <div class="row"><span class="lbl">Image</span><input type="url" id="imgUrl" placeholder="Image link (optional)"><button id="imgAdd">Use link</button>
    <label class="btn">Upload<input type="file" id="imgFile" accept="image/*" hidden></label></div>
   <div class="hint" style="margin:-2px 0 8px 56px">Or paste an image anywhere on the page (Ctrl/Cmd+V)</div>
   <div class="row" id="pend" style="display:none"><span class="lbl">Image</span><img id="pendImg" alt="" style="height:40px;max-width:100px;object-fit:contain;border-radius:4px"><button id="pendClear">Remove</button></div>
   <div class="row"><button class="main" id="addItem" style="font-size:14px;padding:9px 20px">Add item</button><span class="hint">Text, image, or both</span></div>
   <div id="msg"></div>
   </div>
   <ul id="list"></ul>
  </div>
  <div class="card">
   <h2>Outcome order</h2>
   <label class="opt"><input type="radio" name="mode" value="random" checked> Random</label>
   <label class="opt"><input type="radio" name="mode" value="order"> Follow my list order (loops)</label>
   <div class="row" style="margin:6px 0 0"><span class="hint" style="flex:1">Reorder with ↑ ↓ in the items list.</span><button id="seqReset">Restart order</button></div>
  </div>
 </div>
</div>
<script>
const $=s=>document.querySelector(s);
const sample=[['Apple','Banana','Cherry'],['Dog','Cat','Bird'],['Red','Green','Blue']];
const boxes=sample.map(s=>({items:s.map(text=>({text})),seq:0,label:''}));
let n=1,cur=0,busy=false;
const B=()=>boxes[cur];
const msg=m=>{$('#msg').textContent=m||''};

// ---- audio synth ----
let ac;
function ctx(){if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac;}
function tone(f,d,type='square',vol=.1,when=0,to){const a=ctx(),t=a.currentTime+when,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02);}
function noise(dur,vol,cut){const a=ctx(),len=a.sampleRate*dur,b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();f.type='lowpass';f.frequency.value=cut;g.gain.value=vol;s.buffer=b;s.connect(f).connect(g).connect(a.destination);s.start();}
const crash=()=>{noise(.3,.25,6000);tone(300,.25,'sawtooth',.1,0,1200);};

const cv=$('#fx'),cx=cv.getContext('2d');let parts=[],raf=0;
function sizeFx(){const d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0);}
sizeFx();addEventListener('resize',sizeFx);
function boom(x,y){const h=Math.random()*360;for(let i=0;i<80;i++){const a=Math.random()*6.283,s=1+Math.random()*4.6;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,h:h+Math.random()*50});}pop();if(!raf)raf=requestAnimationFrame(frame);}
function frame(){cx.clearRect(0,0,innerWidth,innerHeight);parts=parts.filter(p=>p.life>0);for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.vx*=.985;p.vy*=.985;p.life-=.014;cx.fillStyle=`hsla(${p.h},100%,60%,${Math.max(p.life,0)})`;cx.beginPath();cx.arc(p.x,p.y,2.3,0,6.283);cx.fill();}raf=parts.length?requestAnimationFrame(frame):0;if(!parts.length)cx.clearRect(0,0,innerWidth,innerHeight);}
const fireworks=()=>{for(let i=0;i<6;i++)setTimeout(()=>boom(innerWidth*(.12+Math.random()*.76),innerHeight*(.1+Math.random()*.5)),i*280);};

// ---- items ----
let pending=null;
function node(it,big){
  const w=document.createElement('span');
  if(big)w.className='c'+(it.img&&it.text?' both':'');
  if(it.img){const i=document.createElement('img');i.src=it.img;w.append(i);}
  if(it.text){const s=document.createElement('span');s.className=big?'t':'';s.textContent=it.text;w.append(s);}
  return w;
}
function renderList(){
  const items=B().items;
  const ul=$('#list');ul.replaceChildren();$('#count').textContent=items.length;
  items.forEach((it,i)=>{
    const li=document.createElement('li'),n=document.createElement('span'),p=document.createElement('span');
    n.className='n';n.textContent=i+1;p.className='p';p.append(node(it,false));li.append(n,p);
    const mk=(txt,fn,dis)=>{const b=document.createElement('button');b.textContent=txt;b.disabled=!!dis;b.onclick=fn;li.append(b);};
    mk('↑',()=>{[items[i-1],items[i]]=[items[i],items[i-1]];renderList();},i===0);
    mk('↓',()=>{[items[i+1],items[i]]=[items[i],items[i+1]];renderList();},i===items.length-1);
    mk('✕',()=>{items.splice(i,1);renderList();});
    ul.append(li);
  });
}
const readFile=(f,cb)=>{const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(f);};
function setPending(v){pending=v;$('#pend').style.display=v?'flex':'none';$('#pendImg').src=v||'';}
function addItem(){
  const text=$('#txt').value.trim();
  if(!text&&!pending){msg('Enter some text, an image, or both.');return;}
  B().items.push({text,img:pending});$('#txt').value='';setPending(null);msg('');renderList();
}
$('#addItem').onclick=addItem;
$('#txt').onkeydown=e=>{if(e.key==='Enter')addItem();};
$('#pendClear').onclick=()=>setPending(null);
$('#imgFile').onchange=e=>{const f=e.target.files[0];if(f)readFile(f,v=>{setPending(v);msg('');});e.target.value='';};
addEventListener('paste',e=>{for(const x of e.clipboardData?.items||[])if(x.type.startsWith('image/')){readFile(x.getAsFile(),v=>{setPending(v);msg('');});e.preventDefault();return;}});
$('#imgAdd').onclick=()=>{const u=$('#imgUrl').value.trim();if(!u)return;const im=new Image();im.onload=()=>{setPending(u);$('#imgUrl').value='';msg('');};im.onerror=()=>msg("Couldn't load that image link. Try uploading or pasting the image instead.");im.src=u;};
$('#seqReset').onclick=()=>{boxes.forEach(b=>b.seq=0);};

// ---- boxes ----
const btn=$('#btn'),stages=[];
const hitText=()=>n>1?'Hit the boxes':'Hit the box';
function mkStage(i){
  const col=document.createElement('div');col.className='col';
  const lab=document.createElement('input');lab.type='text';lab.className='label';lab.placeholder='Add header';lab.maxLength=40;lab.value=boxes[i].label;lab.oninput=()=>{boxes[i].label=lab.value;};
  const st=document.createElement('div');st.className='stage';
  st.innerHTML=`<div class="bob"><div class="scene"><div class="cube">${'<div class="face"><svg class="q" viewBox="0 0 100 100"><use href="#qm"/></svg></div>'.repeat(6)}</div></div></div><div class="reel"></div>`;
  col.append(lab,st);
  return {col,lab,st,bob:st.querySelector('.bob'),reel:st.querySelector('.reel')};
}
function buildStages(){
  const wrap=$('#boxes');wrap.replaceChildren();stages.length=0;
  for(let i=0;i<n;i++){const s=mkStage(i);stages.push(s);wrap.append(s.col);}
  btn.textContent=hitText();btn.disabled=false;btn.onclick=run;
}
function shatter(s){const c=['#ff3b5c','#ffb703','#7bd83a','#25c7f0','#8a5cff'];for(let i=0;i<14;i++){const d=document.createElement('div');d.className='shard';d.style.background=c[i%5];s.st.append(d);const a=Math.random()*6.283,r=70+Math.random()*50;requestAnimationFrame(()=>{d.style.transform=`translate(${Math.cos(a)*r-7}px,${Math.sin(a)*r-7}px) rotate(${Math.random()*360}deg)`;d.style.opacity=0;});setTimeout(()=>d.remove(),800);}}
function spin(s,list,final,total,done){
  s.bob.className='bob hit';shatter(s);
  setTimeout(()=>{
    s.bob.style.visibility='hidden';s.reel.className='reel on spin';
    let last=-1;const t0=performance.now();
    (function step(){
      const el=performance.now()-t0;
      if(el>=total){s.reel.replaceChildren(node(final,true));s.reel.className='reel on done';done();return;}
      let i;do{i=Math.floor(Math.random()*list.length);}while(i===last&&list.length>1);
      last=i;s.reel.replaceChildren(node(list[i],true));setTimeout(step,70+(el/total)**3*330);
    })();
  },420);
}
function run(){
  const act=boxes.slice(0,n),bad=act.findIndex(b=>!b.items.length);
  if(bad>=0){msg('Box '+(bad+1)+' has no items.');return;}
  msg('');busy=true;btn.disabled=true;ctx();crash();
  setTimeout(()=>{roulette.currentTime=0;roulette.play().catch(()=>{});},420);
  const mode=document.querySelector('input[name=mode]:checked').value;let left=n;
  act.forEach((b,i)=>{
    const final=mode==='order'?b.items[b.seq++%b.items.length]:b.items[Math.floor(Math.random()*b.items.length)];
    spin(stages[i],b.items.slice(),final,4200+i*500,()=>{fireworks();if(--left===0){busy=false;btn.textContent='Reset';btn.disabled=false;btn.onclick=reset;}});
  });
}
function reset(){roulette.pause();stages.forEach(s=>{s.reel.className='reel';s.bob.className='bob';s.bob.style.visibility='visible';});btn.textContent=hitText();btn.onclick=run;}

// ---- editor controls ----
function renderCounts(){
  const c=$('#counts');c.replaceChildren();
  [1,2,3].forEach(k=>{const b=document.createElement('button');b.textContent=k+(k>1?' boxes':' box');b.className=k===n?'on':'';
    b.onclick=()=>{if(busy)return;n=k;cur=Math.min(cur,n-1);roulette.pause();buildStages();renderCounts();renderEditor();};c.append(b);});
}
function renderEditor(){
  const t=$('#tabs');t.replaceChildren();t.style.display=n>1?'flex':'none';
  for(let i=0;i<n;i++){const b=document.createElement('button');b.textContent='Box '+(i+1);b.className=i===cur?'on':'';
    b.onclick=()=>{cur=i;setPending(null);$('#txt').value='';msg('');renderEditor();};t.append(b);}
  $('#curn').textContent='Box '+(cur+1);renderList();
}
buildStages();renderCounts();renderEditor();
</script>
</body>
</html>
