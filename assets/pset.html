.area{padding:1.5rem}

.list{display:grid;gap:.8rem}

.good{border-color:#258a5d;background:var(--mint)}

.bank .pin{background:#fff;box-shadow:inset 0 0 0 2px var(--line)}
.gap .pin{width:100%;height:100%;box-shadow:none;background:transparent}

.pin.drag{opacity:.4}
.pin.ok::before{background:#258a5d}.pin.no::before{background:#c64f4a}
.ptw{overflow-x:auto;margin:0 auto;padding:.2rem}

.pt tr:last-child>*{border-bottom:0}.pt tr>*:last-child{border-right:0}
.pt .h{background:var(--cream);font-weight:700;color:#5a3416}
.pt td.ok{background:var(--mint)}.pt td.no{background:var(--rose)}
.pt input.pi{display:block;width:100%;min-width:0;height:2.6rem;padding:.3rem .5rem;text-align:center;font-weight:600;border-color:#9db8bb}
.pt td.ok input.pi{border-color:#258a5d}.pt td.no input.pi{border-color:#c64f4a}
.pt td.dz{outline:2px dashed #9db8bb;outline-offset:-6px;background:#fff}

.pfb{min-height:1.4rem;margin:.7rem 0 0;text-align:center;font-weight:700;font-size:.95rem}.pfb.ok{color:#176b47}.pfb.no{color:#9c302b}
.pgw{overflow-x:auto;margin-top:.5rem;padding-bottom:.3rem}
table.pg{border-collapse:separate;border-spacing:.3rem}.pg td{padding:0}
.pgc{display:flex;gap:.25rem;align-items:center;padding:.25rem;border:2px solid transparent;border-radius:.7rem}
.pgc input{width:8rem;min-width:0;padding:.4rem .5rem}
.pgc.hh input{background:#f9efd8;font-weight:700}
.pgc .hb{flex:none;width:2rem;height:2rem;padding:0;display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--line);border-radius:.55rem;background:#fff;color:var(--mute);cursor:pointer}
.pgc.hd{background:#fff0c9;border:2px dashed #e0a437}.pgc.hd .hb{background:#e0a437;border-color:#e0a437;color:#fff}
@media(max-width:600px){.row{grid-template-columns:1fr}.top h1{font-size:1.5rem}}
@media(prefers-reduced-motion:reduce){.bad{animation:none}.btn{transition:none}}

      rows.forEach((row,i)=>row.forEach((v,j)=>{if(r+i<20&&c+j<12)pset(a,r+i,c+j,v.trim())}));save();sync();draw();count()};
     hb.onclick=()=>{phset(a,r,c,!ph(a,r,c));save();look();count()};
     look();cell.append(inp,hb);td.append(cell);tr.append(td)}
    t.append(tr)}
   pgw.append(t)};
  dim(rIn,'rows',20);dim(cIn,'cols',12);sync();
  const tb=(txt,fn)=>{const b=el('button','btn ghost sm',txt);b.type='button';b.onclick=fn;tools.append(b)};
  tb('Hide all non-header cells',()=>{const{R,C}=pdim(a);for(let r=0;r<R;r++)for(let c=0;c<C;c++)if(!phdr(a,r,c)&&String(pc(a,r,c)).trim())phset(a,r,c,true);save();draw();count()});
  tb('Show all cells',()=>{a.hid=[];save();draw();count()});
  const hint=el('p','help','Type the forms into the table (or paste a block of cells copied from a spreadsheet). Click the eye icon on a cell to hide it: hidden cells (shaded) become the practice problems students fill in. In a hidden cell, separate accepted alternatives with a semicolon (;).');
  const ttl=F('Table title (optional)',tx(a.caption||'','e.g. Present tense of gelmek',v=>{a.caption=v}));
  const how=F('Students fill in cells by',sel([['type','Typing (auto-checked)'],['bank','Word bank (drag or tap)']],a.pmode||'type',v=>{a.pmode=v;drawActs()}));
  rc.append(F('Rows',rIn),F('Columns',cIn));
  draw();count();
  const h3=el('h3','qd','Table');h3.style.marginTop='.75rem';
  box.append(h3,hint,tools,pgw,info);
  return{node:box,ctl:[rc,ttl,how]};
 };
 function drawActs(){
  list.innerHTML='';
  S.acts.forEach((a,i)=>{
   const c=el('div','act'),hd=el('div','act-h'),ctl=el('div','btns');
   hd.append(el('span','',`Activity ${i+1}`),ctl);
   const mv=(txt,d)=>{const b=el('button','btn ghost sm',txt);b.type='button';b.setAttribute('aria-label',d?'Move down':'Move up');b.disabled=d?i===S.acts.length-1:i===0;b.onclick=()=>{const j=i+(d?1:-1);[S.acts[i],S.acts[j]]=[S.acts[j],S.acts[i]];save();drawActs()};ctl.append(b)};
   mv('↑',0);mv('↓',1);
   const rm=el('button','btn ghost sm','Remove');rm.type='button';rm.onclick=()=>{S.acts.splice(i,1);save();drawActs()};ctl.append(rm);
   const gr=el('div','stack');
   const cb=(lbl,k,def)=>{const l=el('label','chk'),x=el('input');x.type='checkbox';x.checked=a[k]!==undefined?a[k]:def;x.onchange=()=>{a[k]=x.checked;save()};l.append(x,document.createTextNode(lbl));return l};
   gr.append(F('Type',sel([['match','Match'],['type','Translate'],['build','Build'],['segment','Segment'],['paradigm','Paradigm']],a.type,v=>{a.type=v;drawActs()})));
   if(a.type==='match'||a.type==='type')gr.append(F('Student sees → gives',sel([['ab','A → B'],['ba','B → A']],a.dir,v=>a.dir=v)));
   if(a.type==='match'||a.type==='type')gr.append(F('Practice',sel([['item','Whole items'],['seg','Segments ↔ glosses']],a.level||'item',v=>a.level=v)));
   if(a.type==='segment')gr.append(F('Pins per question',sel([['fixed','Limited: one pin per boundary'],['free','Unlimited: students decide how many']],a.pins==='free'?'free':'fixed',v=>a.pins=v)));
   if(a.type==='type')gr.append(F('Students respond by',sel([['type','Typing (auto-checked)'],['write','Handwriting (self-check)']],a.mode||'type',v=>{a.mode=v;drawActs()})));
   const pg=a.type==='paradigm'?pgrid(a,cb):null;if(pg)pg.ctl.forEach(x=>gr.append(x));
    if(a.type==='build'){const d=el('input');d.type='number';d.min=0;d.max=8;d.value=a.distract;d.oninput=()=>{a.distract=d.value;save()};
    gr.append(F('Extra (wrong) blocks',d),F('Blocks are',sel([['morph','Morphemes'],['word','Words'],['char','Single characters']],a.grain||'morph',v=>a.grain=v)))}
   const trc=cb('Show translations in reference data','exTrans',true),colc=a.type==='match'?cb('Do not show corresponding translations between languages in reference data','exCols',false):null;
   gr.append(cb('Show glosses in reference data','exGloss',false),trc);
   if(colc){const sync=()=>{colc.style.display=a.exTrans===false?'none':''};trc.querySelector('input').addEventListener('change',sync);sync();gr.append(colc)}
   if((a.type==='type'&&a.mode!=='write')||(a.type==='paradigm'&&a.pmode!=='bank'))gr.append(cb('Ignore capital letters','icase',true));
   const dt=el('textarea','actd');dt.value=a.raw||'';dt.spellcheck=false;
   const dc=el('p','help'),cnt2=()=>{const r=parse(a.raw||''),sk=a.type==='segment'?r.items.filter(x=>!hasCut(x)).length:0,n=r.items.length-sk;dc.textContent=n+' valid item'+(n===1?'':'s')+' in this activity.'+(sk?' '+sk+' skipped because the first line has no hyphen to segment.':'')+(r.errs.length?' Problems: '+r.errs.join(' '):'')};
   dt.oninput=()=>{a.raw=dt.value;save();cnt2()};cnt2();
   const dl=el('div');dl.style.marginTop='.75rem';dl.append(el('h3','qd','Question Data'),dt);
   c.append(hd,gr,...(pg?[pg.node]:[dl,dc]));list.append(c)});
  if(!S.acts.length)list.append(el('p','help','No activities yet. Add one below.'));
 }
 [['match','+ Match'],['type','+ Translate'],['build','+ Build'],['segment','+ Segment'],['paradigm','+ Paradigm']].forEach(([t,n])=>{const b=el('button','btn sm',n);b.type='button';b.onclick=()=>{S.acts.push(newAct(t));save();drawActs()};adds.append(b)});
 p3.append(list,adds);drawActs();
 p3.append(el('p','help','Tip: type or paste each activity’s own items into its data box. Activities do not share data with each other or with the Reference Data above.'));
}
