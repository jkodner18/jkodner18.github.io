<!doctype html>
<html lang="en"><head>

<title>Linguistics Puzzle Maker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14213d;--coral:#ef8354;--teal:#177e89;--mint:#d9f2e6;--rose:#ffe1dc;--line:#d5dfdf;--cream:#fff4df;--mute:#5b6b7c}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:#f5f2e8;font-family:"DM Sans","Noto Sans TC","Noto Sans JP","Noto Sans KR",sans-serif;line-height:1.5}
.wrap{width:min(100%,860px);margin:0 auto;padding:1rem}
.bar{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:space-between;margin-bottom:1rem}
.bar h1{font-size:1.25rem;margin:0}
.btns{display:flex;flex-wrap:wrap;gap:.5rem}
.btn,.tab{display:inline-flex;align-items:center;justify-content:center;min-height:2.6rem;padding:.5rem 1rem;border:0;border-radius:.75rem;font:inherit;font-weight:700;color:#fff;background:var(--teal);cursor:pointer;transition:transform .15s}
.btn:hover:not(:disabled){transform:translateY(-2px)}
.btn.coral{background:var(--coral)}.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.sm{min-height:2.4rem;padding:.35rem .8rem}.btn:disabled{opacity:.4;cursor:default}
.tab{background:#fff;color:var(--ink);border:2px solid var(--line);border-radius:999px;font-size:.88rem}
.tab.on{background:var(--teal);border-color:var(--teal);color:#fff}
:focus-visible{outline:4px solid rgba(239,131,84,.45);outline-offset:2px}
.panel{background:#fffdf7;border:2px solid rgba(20,33,61,.1);border-radius:1.25rem;padding:1.25rem;margin-bottom:1rem}
.panel h2{margin:0 0 .75rem;font-size:1.1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.75rem}
label{display:block;font-size:.85rem;font-weight:700;color:var(--mute)}
label>input,label>select,label>textarea{display:block;width:100%;margin-top:.25rem}
input,select,textarea{font:inherit;color:var(--ink);padding:.55rem .7rem;border:2px solid var(--line);border-radius:.65rem;background:#fff}
input:focus,select:focus,textarea:focus{border-color:var(--teal);outline:none;box-shadow:0 0 0 4px rgba(23,126,137,.16)}
textarea.data{min-height:14rem;width:100%;font-size:1.05rem;line-height:1.6}
.stack{display:grid;grid-template-columns:1fr;gap:.75rem}.stack .chk{margin-top:0}
.qd{margin:0 0 .3rem;font-size:.85rem;font-weight:700;color:var(--mute)}
.help{font-size:.85rem;color:var(--mute);margin:.4rem 0 0}
.act{border:2px solid var(--line);border-radius:1rem;padding:1rem;margin-bottom:.75rem;background:var(--cream)}
.act-h{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-bottom:.6rem;font-weight:700}
.chk{display:flex;align-items:center;gap:.5rem;font-size:.9rem;color:var(--ink);margin-top:1.4rem}
.chk input{width:auto;margin:0}
.status{min-height:1.4rem;font-weight:700;font-size:.9rem;color:#9c302b}.status.ok{color:#176b47}
/* player */
.board{background:#fffdf7;border:2px solid rgba(20,33,61,.1);border-radius:1.75rem;box-shadow:0 18px 55px rgba(20,33,61,.13);overflow:hidden}
.top{padding:1.5rem;text-align:center;border-bottom:1px solid rgba(20,33,61,.1)}
.top h1{margin:0;font-size:1.8rem;line-height:1.15}
.top .intro{max-width:620px;margin:.6rem auto 0;color:#425466;white-space:pre-line}
.tabs{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin:1rem 0 .5rem}
.scores{display:flex;flex-wrap:wrap;justify-content:center;gap:1.25rem;margin-top:.8rem;font-weight:700}
.sn{display:inline-block;min-width:3.2rem;padding:.2rem .55rem;margin-left:.4rem;text-align:center;border-radius:.6rem;color:#fff;background:var(--ink);font-variant-numeric:tabular-nums}
.area{padding:1.5rem}
.area h2{margin:0 0 .3rem;font-size:1.3rem;text-align:center}
.inst{max-width:620px;margin:0 auto 1.2rem;text-align:center;color:#425466}
.list{display:grid;gap:.8rem}
.row{display:grid;grid-template-columns:minmax(110px,.9fr) minmax(0,1.8fr);gap:.8rem 1.1rem;align-items:center;padding:.9rem 1rem;border:2px solid transparent;border-radius:1rem;background:var(--cream);transition:border-color .2s,background .2s}
.row.col{grid-template-columns:1fr}
.good{border-color:#258a5d;background:var(--mint)}
.bad{border-color:#c64f4a;background:var(--rose);animation:shake .36s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pw{display:flex;align-items:center;gap:.7rem}
.num{flex:none;display:inline-flex;align-items:center;justify-content:center;width:1.9rem;height:1.9rem;border-radius:50%;color:#fff;background:var(--teal);font-size:.82rem;font-weight:700}
.prompt{font-size:1.35rem;font-weight:700;color:#5a3416;overflow-wrap:anywhere}
.line{display:flex;gap:.6rem}.line .inp{flex:1;min-width:0;font-weight:600;min-height:2.8rem}
.fb{margin:.35rem 0 0;font-size:.88rem;font-weight:700;display:none}
.good .fb{display:block;color:#176b47}.bad .fb{display:block;color:#9c302b}
.note{margin:.4rem 0 0;font-size:.85rem;color:var(--mute)}
.slot,.zone{min-height:3.1rem;padding:.3rem;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;border:2px dashed #9db8bb;border-radius:.75rem;background:#fff}

.zone.b2{margin-top:.5rem;border-style:solid;border-color:var(--line);background:transparent}
.over{border-color:var(--teal);background:#d8eef0}
.chip{padding:.45rem .95rem;border:2px solid var(--teal);border-radius:.7rem;background:#fff;color:var(--ink);font:inherit;font-weight:700;font-size:1.05rem;cursor:grab;touch-action:manipulation}
.chip.sel{background:var(--teal);color:#fff}.chip.drag{opacity:.4}.chip.ok{background:var(--mint);border-color:#258a5d}.chip.no{background:var(--rose);border-color:#c64f4a}.chip small{display:block;font-weight:500;font-size:.72rem;opacity:.8}
.lab{margin:0 0 .4rem;text-align:center;font-size:.85rem;font-weight:700;color:var(--teal)}
.acts{display:flex;flex-wrap:wrap;justify-content:center;gap:.7rem;margin-top:1.2rem}
.nav{display:flex;justify-content:space-between;padding:0 1.5rem 1.5rem}
.reveal{margin:.5rem 0 0;font-weight:700;color:#176b47;display:none}
textarea.wr{width:100%;min-height:4rem}
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:1rem;background:rgba(20,33,61,.5)}
.mbox{width:min(100%,520px);max-height:90vh;overflow:auto;background:#fffdf7;border-radius:1.25rem;padding:1.25rem}
.mbox h3{margin:0 0 .75rem}.mbox label{margin-bottom:.6rem}.mbox input{font-size:1.05rem}
.ed{margin-left:auto;flex:none;min-height:2rem;padding:.15rem .6rem}
.wbw{text-align:left;margin-top:.6rem}
.row>.wbw{grid-column:1/-1;margin-top:0}
.arow{display:flex;gap:.6rem;align-items:stretch}.arow .zone,.arow .slot{flex:1}.mrow{min-width:0}
.eye{padding:.3rem .7rem}.eye svg{display:block}
.wb{margin:.8rem auto 0;max-width:640px;padding:1rem;border:2px dashed #9db8bb;border-radius:1rem;background:#fff;text-align:left}
.wb h4{margin:.2rem 0 .4rem;font-size:.9rem;color:var(--teal)}
.wbp{display:flex;flex-wrap:wrap;gap:.4rem .6rem;margin:0 0 .8rem;padding:0;list-style:none}
.wbp li{padding:.2rem .6rem;border-radius:.5rem;background:var(--cream);font-weight:600}
.wbt{display:block;color:var(--mute);font-weight:500}
.wbe{margin:0;padding:0;list-style:none}.wbe li{padding:.15rem 0}
.pad{display:block;width:100%;height:9rem;border:2px solid var(--line);border-radius:.75rem;background:#fff;touch-action:none;cursor:crosshair}
.actd{display:block;width:100%;min-height:9rem;font-size:1rem;line-height:1.6}
.exs{max-width:640px;margin:0 auto;padding:.8rem 1rem;text-align:left;border:2px dashed #9db8bb;border-radius:1rem;background:#fff}
.exs summary{cursor:pointer;font-weight:700;color:var(--teal)}
.excols{display:grid;grid-template-columns:1fr 1fr;gap:.45rem 1.5rem;text-align:left}
.excols.one{grid-template-columns:1fr}
.excell{font-size:1.1rem;padding:.15rem 0}
.exi:first-child{margin-top:0;padding-top:0;border-top:0}
.tip{position:fixed;z-index:60;display:none;padding:.25rem .6rem;border-radius:.5rem;background:var(--ink);color:#fff;font-size:.82rem;font-weight:600;pointer-events:none;white-space:nowrap;transform:translate(-50%,-100%)}
.exi{margin-top:.7rem;padding-top:.6rem;border-top:1px solid var(--line)}
.exl{display:flex;flex-wrap:wrap;gap:.1rem 1.1rem}
.exw b{display:block;font-size:1.2rem}.exw span{display:block;font-size:.85rem;color:var(--mute)}
.ext{margin:.2rem 0 0;color:#425466}
.tools{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
@media(max-width:600px){.row{grid-template-columns:1fr}.top h1{font-size:1.5rem}}
@media(prefers-reduced-motion:reduce){.bad{animation:none}.btn{transition:none}}
</style></head>

/* ---------- data ---------- */
const alts=s=>s.split(';').map(x=>x.trim()).filter(Boolean);

   if(gw.length===w.length&&gw.every((x,i)=>x.length===w[i].length)){g=gw;gs=L[1]}

const parseItems=raw=>parse(raw).items;

 delete j.title;delete j.intro;delete j.labA;delete j.labB;
 return j};

 items.forEach(it=>{if(it.gw)it.words.forEach((w,i)=>w.forEach((m,j)=>{const g=it.gw[i][j],k=m+'\u0001'+g;if(seen.has(k))return;seen.add(k);out.push({a:[m],b:[g],marked:m,gloss:'',blk:it.blk,src:it})}))});

const shw=(it,s,a)=>s==='a'?it.marked:it[s][0];

 if(a.bank!==true||!all.length)return null;

  const box=el('div','wb'),wrap=el('div','wbw'),btn=el('button','btn ghost sm',T.wbShow);box.hidden=true;btn.type='button';
  if(pairs.length){box.append(el('h4','',T.wbP));const u=el('ul','wbp');pairs.forEach(q=>u.append(el('li','',q.a[0]+' = '+q.b[0])));box.append(u)}

 if(!range||!range.trim())return items;

 range.split(',').forEach(p=>{const m=p.trim().match(/^(\d+)(?:\s*-\s*(\d+))?$/);if(m){const lo=+m[1],hi=+(m[2]||m[1]);for(let i=lo;i<=hi;i++)keep.add(i)}});

function bMatch(a,list,all,c){

 const place=(ch,tg)=>{if(!ch)return;if(tg.classList.contains('slot')){const ex=tg.querySelector('.chip');if(ex&&ex!==ch)bank.append(ex)}tg.append(ch);ch.classList.remove('sel');sel=null;rows.querySelectorAll('.row').forEach(r=>r.classList.remove('good','bad'))};

   if(colc){const sync=()=>{colc.style.display=a.exTrans===false?'none':''};trc.querySelector('input').addEventListener('change',sync);sync();gr.append(colc)}
   if(a.type==='type'&&a.mode!=='write')gr.append(cb('Ignore capital letters','icase',true));
   const dt=el('textarea','actd');dt.value=a.raw||'';dt.spellcheck=false;
   const dc=el('p','help'),cnt2=()=>{const r=parse(a.raw||''),n=r.items.length;dc.textContent=n+' valid item'+(n===1?'':'s')+' in this activity.'+(r.errs.length?' Problems: '+r.errs.join(' '):'')};
   dt.oninput=()=>{a.raw=dt.value;save();cnt2()};cnt2();
   const dl=el('div');dl.style.marginTop='.75rem';dl.append(el('h3','qd','Question Data'),dt);
   c.append(hd,gr,dl,dc);list.append(c)});
  if(!S.acts.length)list.append(el('p','help','No activities yet. Add one below.'));
 }
 [['match','+ Match'],['type','+ Translate'],['build','+ Build']].forEach(([t,n])=>{const b=el('button','btn sm',n);b.type='button';b.onclick=()=>{S.acts.push(newAct(t));save();drawActs()};adds.append(b)});
 p3.append(list,adds);drawActs();
 p3.append(el('p','help','Tip: type or paste each activity’s own items into its data box. Activities do not share data with each other or with the Reference Data above.'));
}

/* ---------- start ---------- */
const root=$('#app');
if(EMBED){S=EMBED;document.title=S.title||'Puzzle';playApp(root,S)}
else{S=load();editApp(root)}
</script>
